name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-14
    env:
      BUNDLE: build/openGlitchFX_artefacts/Release/VST3/openGlitchFX.vst3
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Sign ad hoc
        run: codesign --force --deep --sign - "$BUNDLE"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$BUNDLE"

      - name: Package
        run: |
          mkdir -p dist
          ditto "$BUNDLE" "dist/$(basename "$BUNDLE")"
          python3 scripts/package_notices.py dist
          ditto -c -k dist openGlitchFX-VST3-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openGlitchFX-VST3-macOS
          path: openGlitchFX-VST3-macOS.zip

  windows:
    runs-on: windows-latest
    env:
      BUNDLE: build/openGlitchFX_artefacts/Release/VST3/openGlitchFX.vst3
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:BUNDLE"

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$env:BUNDLE" dist/
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath openGlitchFX-VST3-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openGlitchFX-VST3-Windows
          path: openGlitchFX-VST3-Windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: openGlitchFX-VST3-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
