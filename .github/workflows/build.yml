name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: false
    runs-on: macos-15
    env:
      BUNDLE: build/openGlitchFX_artefacts/Release/VST3/openGlitchFX.vst3
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Sign ad hoc
        run: |
          codesign --force --deep --sign - "$BUNDLE"
          codesign --force --deep --sign - "build/openGlitchFX_artefacts/Release/AU/openGlitchFX.component"
          codesign --force --deep --sign - "build/openGlitchFX_artefacts/Release/Standalone/openGlitchFX.app"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$BUNDLE"
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "build/openGlitchFX_artefacts/Release/AU/openGlitchFX.component"

      - name: Package
        run: |
          package() {
            local bundle="$1"
            local zip="$2"
            rm -rf dist
            mkdir -p dist
            ditto "$bundle" "dist/$(basename "$bundle")"
            python3 scripts/package_notices.py dist
            ditto -c -k dist "$zip"
          }
          package "$BUNDLE" openGlitchFX-VST3-macOS.zip
          package "build/openGlitchFX_artefacts/Release/AU/openGlitchFX.component" openGlitchFX-AU-macOS.zip
          package "build/openGlitchFX_artefacts/Release/Standalone/openGlitchFX.app" openGlitchFX-Standalone-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openGlitchFX-VST3-macOS
          path: |
            openGlitchFX-VST3-macOS.zip
            openGlitchFX-AU-macOS.zip
            openGlitchFX-Standalone-macOS.zip

  windows:
    runs-on: windows-latest
    env:
      BUNDLE: build/openGlitchFX_artefacts/Release/VST3/openGlitchFX.vst3
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect editor preview
        id: preview
        continue-on-error: true
        shell: pwsh
        run: |
          $found = $null
          foreach ($rel in @('assets\native-ui.png', 'build\assets\native-ui.png')) {
            if (Test-Path $rel) { $found = (Resolve-Path $rel).Path; break }
          }
          if (-not $found) {
            $item = Get-ChildItem -Path . -Recurse -Filter native-ui.png -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($item) { $found = $item.FullName }
          }
          if (-not $found) { Write-Error 'Editor test did not write native-ui.png'; exit 1 }
          New-Item -ItemType Directory -Force -Path preview-out | Out-Null
          Copy-Item -Force $found preview-out\preview.png
          Write-Host "Collected $found"

      - uses: actions/upload-artifact@v4
        if: steps.preview.outcome == 'success'
        with:
          name: preview-screenshot
          path: preview-out/preview.png
          if-no-files-found: error

      - name: Validate with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:BUNDLE"

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$env:BUNDLE" dist/
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath openGlitchFX-VST3-Windows.zip
          Remove-Item -Recurse -Force dist
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item "build/openGlitchFX_artefacts/Release/Standalone/openGlitchFX.exe" dist/
          if (Test-Path "build/openGlitchFX_artefacts/Release/Standalone/*.dll") {
            Copy-Item "build/openGlitchFX_artefacts/Release/Standalone/*.dll" dist/
          }
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath openGlitchFX-Standalone-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openGlitchFX-VST3-Windows
          path: |
            openGlitchFX-VST3-Windows.zip
            openGlitchFX-Standalone-Windows.zip

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && (needs.macos.result == 'skipped' || needs.macos.result == 'success') }}
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Write release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: python3 scripts/release_notes.py --tag "$RELEASE_TAG" --repo "$RELEASE_REPO" > "$RUNNER_TEMP/release_body.md"

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Require the existing VST3 archive and the standalone archive
        run: |
          ls openGlitchFX-VST3-*.zip
          ls openGlitchFX-Standalone-*.zip
      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release_body.md
          files: |
            openGlitchFX-VST3-*.zip
            openGlitchFX-AU-*.zip
            openGlitchFX-Standalone-*.zip
          fail_on_unmatched_files: false
          generate_release_notes: false

  update-preview:
    # The Windows unit tests already render the editor (assets/native-ui.png) and
    # then discard it. Publish that capture to docs/screenshots/preview.png on main.
    # macOS and Linux package jobs stay disabled; this job only commits the image.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect editor changes
        id: gate
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" \
            | grep -vE '^(docs/screenshots/preview\.png|assets/native-ui\.png)$' \
            | grep -qE '^(Source/|Tests/|assets/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No editor changes; keeping the committed preview."
          fi

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: preview-screenshot
          path: preview

      - name: Commit refreshed preview
        if: steps.gate.outputs.run == 'true'
        run: |
          test -f preview/preview.png
          cp preview/preview.png docs/screenshots/preview.png
          cp preview/preview.png assets/native-ui.png
          if git diff --quiet -- docs/screenshots/preview.png assets/native-ui.png; then
            echo "Preview unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/preview.png assets/native-ui.png
          git commit -m "docs: refresh preview screenshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
