name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: false
    runs-on: macos-15
    env:
      BUNDLE: build/openGlitchFX_artefacts/Release/VST3/openGlitchFX.vst3
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Sign ad hoc
        run: |
          codesign --force --deep --sign - "$BUNDLE"
          codesign --force --deep --sign - "build/openGlitchFX_artefacts/Release/AU/openGlitchFX.component"
          codesign --force --deep --sign - "build/openGlitchFX_artefacts/Release/Standalone/openGlitchFX.app"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$BUNDLE"
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "build/openGlitchFX_artefacts/Release/AU/openGlitchFX.component"

      - name: Package
        run: |
          package() {
            local bundle="$1"
            local zip="$2"
            rm -rf dist
            mkdir -p dist
            ditto "$bundle" "dist/$(basename "$bundle")"
            python3 scripts/package_notices.py dist
            ditto -c -k dist "$zip"
          }
          package "$BUNDLE" openGlitchFX-VST3-macOS.zip
          package "build/openGlitchFX_artefacts/Release/AU/openGlitchFX.component" openGlitchFX-AU-macOS.zip
          package "build/openGlitchFX_artefacts/Release/Standalone/openGlitchFX.app" openGlitchFX-Standalone-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openGlitchFX-VST3-macOS
          path: |
            openGlitchFX-VST3-macOS.zip
            openGlitchFX-AU-macOS.zip
            openGlitchFX-Standalone-macOS.zip

  windows:
    runs-on: windows-latest
    env:
      BUNDLE: build/openGlitchFX_artefacts/Release/VST3/openGlitchFX.vst3
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:BUNDLE"

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$env:BUNDLE" dist/
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath openGlitchFX-VST3-Windows.zip
          Remove-Item -Recurse -Force dist
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item "build/openGlitchFX_artefacts/Release/Standalone/openGlitchFX.exe" dist/
          if (Test-Path "build/openGlitchFX_artefacts/Release/Standalone/*.dll") {
            Copy-Item "build/openGlitchFX_artefacts/Release/Standalone/*.dll" dist/
          }
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath openGlitchFX-Standalone-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openGlitchFX-VST3-Windows
          path: |
            openGlitchFX-VST3-Windows.zip
            openGlitchFX-Standalone-Windows.zip

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && (needs.macos.result == 'skipped' || needs.macos.result == 'success') }}
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Require the existing VST3 archive and the standalone archive
        run: |
          ls openGlitchFX-VST3-*.zip
          ls openGlitchFX-Standalone-*.zip
      - uses: softprops/action-gh-release@v2
        with:
          body: '![Editor](https://raw.githubusercontent.com/alanmarcero/openGlitchFX/${{ github.ref_name }}/docs/screenshots/preview.png)'
          files: |
            openGlitchFX-VST3-*.zip
            openGlitchFX-AU-*.zip
            openGlitchFX-Standalone-*.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
